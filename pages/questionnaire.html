<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Perfil Relacional
  </title>

  <link
    rel="stylesheet"
    href="../styles/main.css">

</head>

<body>

  <div class="container">

    <header classerfil Relacional
      </h1>

      <p>
        Descubre tu estilo predominante de comunicación y relación.
      </p>

    </header>

    <section class="card">

      <h2>
        Datos personales
      </h2>

      <div class="profile-grid">

        <div>

          <label>
            Nombre
          </label>

          <input
            id="name"
            placeholder="Tu nombre">

        </div>

        <div>

          <label>
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="tu@email.com">

        </div>

      </div>

    </section>

    <section class="card">

      <h2>
        Progreso
      </h2>

      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar">
        </div>

      </div>

      <p
        id="progressText"
        style="margin-top:10px;">

        0% completado

      </p>

    </section>

    <section class="card">

      <h2>
        Cuestionario
      </h2>

      <div
        id="questionsContainer">
      </div>

    </section>

    <section class="card action-panel">

      <button
        id="generateBtn">

        Generar Perfil

      </button>

    </section>

  </div>

  <script type="module">

    import {
      QUESTIONS
    }
    from "../data/questions.js";

    const container =
      document.getElementById(
        "questionsContainer"
      );

    const answers = {};

    renderQuestions();

    function renderQuestions() {

      QUESTIONS.forEach(question => {

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "question-card";

        wrapper.innerHTML = `

          <div class="question-title">

            ${question.id}.
            ${question.text}

          </div>

          <select
            data-id="${question.id}">

            <option value="">
              Selecciona una respuesta
            </option>

            <option value="1">
              1 - Nada identificado
            </option>

            <option value="2">
              2
            </option>

            <option value="3">
              3
            </option>

            <option value="4">
              4
            </option>

            <option value="5">
              5 - Muy identificado
            </option>

          </select>

        `;

        container.appendChild(
          wrapper
        );
      });

      attachEvents();
    }

    function attachEvents() {

      document
        .querySelectorAll(
          "select[data-id]"
        )
        .forEach(select => {

          select.addEventListener(
            "change",
            event => {

              const id =
                event.target.dataset.id;

              answers[id] =
                Number(
                  event.target.value
                );

              updateProgress();
            }
          );

        });

    }

    function updateProgress() {

      const total =
        QUESTIONS.length;

      const answered =
        Object.keys(
          answers
        ).length;

      const percentage =
        Math.round(
          (answered / total)
          * 100
        );

      document
        .getElementById(
          "progressBar"
        )
        .style.width =
          percentage + "%";

      document
        .getElementById(
          "progressText"
        )
        .textContent =
          percentage +
          "% completado";
    }

    document
      .getElementById(
        "generateBtn"
      )
      .addEventListener(
        "click",
        () => {

          const name =
            document
              .getElementById(
                "name"
              )
              .value
              .trim();

          if (!name) {

            alert(
              "Introduce tu nombre"
            );

            return;
          }

          const total =
            QUESTIONS.length;

          const answered =
            Object.keys(
              answers
            ).length;

          if (answered < total) {

            alert(
              `Faltan ${
                total - answered
              } preguntas por responder`
            );

            return;
          }

          localStorage.setItem(
            "answers",
            JSON.stringify(
              answers
            )
          );

          localStorage.setItem(
            "userData",
            JSON.stringify({

              name,

              email:
                document
                  .getElementById(
                    "email"
                  )
                  .value

            })
          );

          window.location.href =
            "./report.html";

        }
      );

  </script>

</body>

</html>
