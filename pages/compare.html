<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
Comparar perfiles
</title>

<link
  rel="stylesheet"
  href="../stylesclass="container">

  <header class="report-header">

    <h1>
      Comparador de Perfiles
    </h1>

    <p>
      Analiza la compatibilidad entre dos personas.
    </p>

  </header>

  <section class="card">

    <h2>
      Perfil A
    </h2>

    <textarea
      id="profileA"
      rows="10"
      placeholder="Pega aquí el JSON del Perfil A">
    </textarea>

  </section>

  <section class="card">

    <h2>
      Perfil B
    </h2>

    <textarea
      id="profileB"
      rows="10"
      placeholder="Pega aquí el JSON del Perfil B">
    </textarea>

  </section>

  <section class="card action-panel">

    <button id="compareBtn">

      Calcular Compatibilidad

    </button>

  </section>

  <section
    id="results"
    style="display:none">

    <section class="card">

      <h2>
        Compatibilidad Global
      </h2>

      <div
        id="score"
        class="compatibility-score">
      </div>

      <div
        id="level"
        class="compatibility-label">
      </div>

      <p
        id="summary"
        style="
          margin-top:20px;
          text-align:center;">
      </p>

    </section>

    <section class="card">

      <h2>
        Perfiles Comparados
      </h2>

      <div
        class="profile-grid">

        <div>

          <h3>
            Persona A
          </h3>

          <p id="styleA">
          </p>

        </div>

        <div>

          <h3>
            Persona B
          </h3>

          <p id="styleB">
          </p>

        </div>

      </div>

    </section>

    <section class="card">

      <h2>
        Fortalezas de la Relación
      </h2>

      <ul id="strengths">
      </ul>

    </section>

    <section class="card">

      <h2>
        Riesgos Potenciales
      </h2>

      <ul id="risks">
      </ul>

    </section>

    <section class="card">

      <h2>
        Recomendaciones para Persona A
      </h2>

      <ul id="recommendationsA">
      </ul>

    </section>

    <section class="card">

      <h2>
        Recomendaciones para Persona B
      </h2>

      <ul id="recommendationsB">
      </ul>

    </section>

  </section>

</div>

<script type="module">

import {
  createCompatibilityReport
}
from "../services/compatibilityEngine.js";

document
  .getElementById(
    "compareBtn"
  )
  .addEventListener(
    "click",
    compareProfiles
  );

function compareProfiles() {

  try {

    const profileA =
      JSON.parse(
        document
          .getElementById(
            "profileA"
          )
          .value
      );

    const profileB =
      JSON.parse(
        document
          .getElementById(
            "profileB"
          )
          .value
      );

    const report =
      createCompatibilityReport(
        profileA.profile,
        profileB.profile
      );

    renderReport(
      report
    );

  }

  catch(error) {

    alert(
      "JSON inválido"
    );

    console.error(error);

  }

}

function renderReport(
  report
) {

  document
    .getElementById(
      "results"
    )
    .style.display =
      "block";

  document
    .getElementById(
      "score"
    )
    .textContent =
      report.score + "/100";

  document
    .getElementById(
      "level"
    )
    .textContent =
      report.level;

  document
    .getElementById(
      "summary"
    )
    .textContent =
      report.summary;

  document
    .getElementById(
      "styleA"
    )
    .textContent =
      report.styleA;

  document
    .getElementById(
      "styleB"
    )
    .textContent =
      report.styleB;

  renderList(
    "strengths",
    report.strengths
  );

  renderList(
    "risks",
    report.risks
  );

  renderList(
    "recommendationsA",
    report.recommendationsA
  );

  renderList(
    "recommendationsB",
    report.recommendationsB
  );

}

function renderList(
  elementId,
  items
) {

  const ul =
    document.getElementById(
      elementId
    );

  ul.innerHTML = "";

  items.forEach(item => {

    const li =
      document.createElement(
        "li"
      );

    li.textContent =
      item;

    ul.appendChild(
      li
    );

  });

}

</script>

</body>

</html>
