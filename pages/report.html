<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Informe de Perfil Relacional
  </title>

  <link
    rel="stylesheet"
    href="../styles/main.css">

<">

    <header class="report-header">

      <h1>
        Informe de Perfil Relacional
      </h1>

      <p id="userName">
        Participante
      </p>

    </header>

    <section class="card">

      <h2>
        Perfil Predominante
      </h2>

      <div
        id="dominantProfileCard">

      </div>

    </section>

    <section class="card">

      <h2>
        Resumen Ejecutivo
      </h2>

      <h3 id="profileTitle">
      </h3>

      <p id="profileSummary">
      </p>

    </section>

    <section class="card">

      <h2>
        Resultado del Perfil
      </h2>

      <div class="profile-grid">

        <div>

          <strong>
            Tipo de perfil
          </strong>

          <p id="profileType">
          </p>

        </div>

        <div>

          <strong>
            Estilos dominantes
          </strong>

          <p id="dominantStyles">
          </p>

        </div>

        <div>

          <strong>
            Estilo menos utilizado
          </strong>

          <p id="weakestStyle">
          </p>

        </div>

        <div>

          <strong>
            Intensidad
          </strong>

          <p id="intensity">
          </p>

        </div>

      </div>

    </section>

    <section class="card">

      <h2>
        Distribución de estilos
      </h2>

      <div id="percentages">
      </div>

    </section>

    <section class="card">

      <h2>
        Mapa de estilos
      </h2>

      <div id="styleMap">
      </div>

    </section>

    <section class="card">

      <h2>
        Fortalezas principales
      </h2>

      <ul id="strengths">
      </ul>

    </section>

    <section class="card">

      <h2>
        Riesgos potenciales
      </h2>

      <ul id="risks">
      </ul>

    </section>

    <section class="card action-panel">

      <button id="backBtn">

        Volver al cuestionario

      </button>

      <button id="compareBtn">

        Comparar perfiles

      </button>

    </section>

  </div>

  <script type="module">

    import {
      evaluateProfile
    }
    from "../services/scoringEngine.js";

    import {
      renderPercentages
    }
    from "../ui/charts.js";

    import {
      renderStyleMap
    }
    from "../ui/styleMap.js";

    import {
      getStyleName,
      getStyleColor,
      getStyleIcon
    }
    from "../data/styles.js";

    const answers =
      JSON.parse(
        localStorage.getItem(
          "answers"
        ) || "{}"
      );

    const userData =
      JSON.parse(
        localStorage.getItem(
          "userData"
        ) || "{}"
      );

    if (
      Object.keys(
        answers
      ).length === 0
    ) {

      alert(
        "No existen respuestas guardadas."
      );

      location.href =
        "./questionnaire.html";

    }

    const result =
      evaluateProfile(
        userData,
        answers
      );

    renderReport(
      result
    );

    function renderReport(
      result
    ) {

      document
        .getElementById(
          "userName"
        )
        .textContent =
          result.user.name;

      document
        .getElementById(
          "profileTitle"
        )
        .textContent =
          result.summary.title;

      document
        .getElementById(
          "profileSummary"
        )
        .textContent =
          result.summary.summary;

      document
        .getElementById(
          "profileType"
        )
        .textContent =
          result.profile.profileType;

      document
        .getElementById(
          "dominantStyles"
        )
        .textContent =
          result.profile
            .dominantStyles
            .map(style =>
              getStyleName(style)
            )
            .join(" · ");

      document
        .getElementById(
          "weakestStyle"
        )
        .textContent =
          getStyleName(
            result.profile
              .weakestStyle
          );

      document
        .getElementById(
          "intensity"
        )
        .textContent =
          result.profile
            .intensity;

      renderDominantCard(
        result.profile
      );

      renderPercentages(
        "percentages",
        result.profile
          .percentages
      );

      renderStyleMap(
        "styleMap",
        result.profile
      );

      renderList(
        "strengths",
        result.strengths
      );

      renderList(
        "risks",
        result.risks
      );

    }

    function renderDominantCard(
      profile
    ) {

      const dominant =
        profile
          .dominantStyles[0];

      document
        .getElementById(
          "dominantProfileCard"
        )
        .innerHTML = `

          <div
            style="
              text-align:center;
              padding:30px;
              border-radius:16px;
              border:3px solid ${getStyleColor(dominant)};
            ">

            <h1>

              ${getStyleIcon(dominant)}

            </h1>

            <h2
              style="
                border:none;
                padding:0;
                margin:0;
                color:${getStyleColor(dominant)};
              ">

              ${getStyleName(dominant)}

            </h2>

          </div>

        `;

    }

    function renderList(
      elementId,
      items
    ) {

      const ul =
        document.getElementById(
          elementId
        );

      ul.innerHTML = "";

      items.forEach(item => {

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          item;

        ul.appendChild(
          li
        );

      });

    }

    document
      .getElementById(
        "backBtn"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            "./questionnaire.html";

        }
      );

    document
      .getElementById(
        "compareBtn"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            "./compare.html";

        }
      );

  </script>

</body>

</html>
