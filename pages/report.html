<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conecta360 | Informe</title>


<style>

:root{
  --primary:#2962ff;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1f2937;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

.container{
  width:min(1200px,95%);
  margin:20px auto;
}

.hero{
  background:linear-gradient(
    135deg,
    #2962ff,
    #5d8dff
  );

  color:white;
  padding:40px;
  border-radius:20px;
  margin-bottom:20px;
}

.hero h1{
  margin-bottom:10px;
}

.hero p{
  opacity:.95;
}

.card{

  background:var(--card);

  border-radius:20px;

  padding:25px;

  margin-bottom:20px;

  box-shadow:
  0 3px 10px
  rgba(0,0,0,.08);
}

.section-title{
  color:#2962ff;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:
     repeat(
       auto-fit,
       minmax(220px,1fr)
     );

  gap:20px;
}

.score-box{

  background:#f5f9ff;

  padding:20px;

  border-radius:15px;

  text-align:center;
}

.score-value{
  font-size:2rem;
  font-weight:bold;
}

.chart-wrapper{
  height:400px;
}

ul{
  padding-left:20px;
}

li{
  margin-bottom:8px;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button{

  border:none;

  border-radius:10px;

  padding:14px 20px;

  cursor:pointer;

  font-weight:bold;
}

.primary{
  background:#2962ff;
  color:white;
}

.secondary{
  background:#16a34a;
  color:white;
}

.gray{
  background:#e5e7eb;
}

.profile-badge{

  display:inline-block;

  background:#2962ff;

  color:white;

  border-radius:999px;

  padding:10px 18px;

  margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>Conecta360</h1>

<p>
Informe de Perfil Relacional
</p>

<div
 id="profileBadge"
 class="profile-badge"
>
Cargando...
</div>

</div>

<div class="card">

<h2 class="section-title">
Participante
</h2>

<div id="userInfo"></div>

</div>

<div class="card">

<h2 class="section-title">
Resumen Ejecutivo
</h2>

<div id="summary"></div>

</div>

<div class="card">

<h2 class="section-title">
Perfil Identificado
</h2>

<div id="profileData"></div>

</div>

<div class="card">

<h2 class="section-title">
Distribución de Estilos
</h2>

<div class="grid">

<div class="score-box">
<div class="score-value"
     id="tierraScore">
0%
</div>
<div>
Analítico
</div>
</div>

<div class="score-box">
<div class="score-value"
     id="fuegoScore">
0%
</div>
<div>
Directivo
</div>
</div>

<div class="score-box">
<div class="score-value"
     id="aguaScore">
0%
</div>
<div>
Relacional
</div>
</div>

<div class="score-box">
<div class="score-value"
     id="aireScore">
0%
</div>
<div>
Facilitador
</div>
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
Gráfico de Perfil
</h2>

<div class="chart-wrapper">
<canvas id="profileChart"></canvas>
</div>

</div>

<div class="card">

<h2 class="section-title">
Fortalezas
</h2>

<ul id="strengths"></ul>

</div>

<div class="card">

<h2 class="section-title">
Riesgos Potenciales
</h2>

<ul id="risks"></ul>

</div>

<div class="card">

<div class="actions">

<button
 class="primary"
 id="downloadPdfBtn">
Descargar PDF
</button>

<button
 class="secondary"
 onclick="window.location.href='questionnaire.html'">
Nuevo Test
</button>

<button
 class="gray"
 onclick="window.location.href='admin.html'">
Administración
</button>

</div>

</div>

</div>

<script type="module">

import PdfGenerator
from "../services/pdfGenerator.js";

const storedProfile =
localStorage.getItem(
  "conecta360Profile"
);

if(!storedProfile){

  alert(
    "No existe ningún perfil calculado."
  );

  window.location.href =
  "questionnaire.html";
}

const result =
JSON.parse(storedProfile);

renderProfile(result);

renderChart(
 result.profile.percentages
);

function renderProfile(result){

  document
  .getElementById(
    "profileBadge"
  )
  .textContent =
    `${result.profile.dominantStyleIcon} ${result.profile.dominantStyleName}`;

  document
  .getElementById(
    "userInfo"
  )
  .innerHTML = `

    <p>
      <strong>Nombre:</strong>
      ${result.user.name}
    </p>

    <p>
      <strong>Email:</strong>
      ${result.user.email || "-"}
    </p>

    <p>
      <strong>Fecha:</strong>
      ${new Date(
      result.generatedAt
      ).toLocaleString()}
    </p>

  `;

  document
  .getElementById(
    "summary"
  )
  .innerHTML = `
    <h3>
      ${result.summary.title}
    </h3>

    <p>
      ${result.summary.summary}
    </p>
  `;

  document
  .getElementById(
    "profileData"
  )
  .innerHTML = `

    <p>
      <strong>Tipo:</strong>
      ${result.profile.profileType}
    </p>

    <p>
      <strong>Intensidad:</strong>
      ${result.profile.intensity}
    </p>

    <p>
      <strong>Estilo dominante:</strong>
      ${result.profile.dominantStyleName}
    </p>

    <p>
      <strong>Estilo menos utilizado:</strong>
      ${result.profile.weakestStyle}
    </p>

  `;

  const p =
  result.profile.percentages;

  document.getElementById(
    "tierraScore"
  ).textContent =
    `${p.tierra}%`;

  document.getElementById(
    "fuegoScore"
  ).textContent =
    `${p.fuego}%`;

  document.getElementById(
    "aguaScore"
  ).textContent =
    `${p.agua}%`;

  document.getElementById(
    "aireScore"
  ).textContent =
    `${p.aire}%`;

  document
  .getElementById(
    "strengths"
  )
  .innerHTML =
    result.strengths
      .map(
        item =>
         `<li>${item}</li>`
      )
      .join("");

  document
  .getElementById(
    "risks"
  )
  .innerHTML =
    result.risks
      .map(
        item =>
         `<li>${item}</li>`
      )
      .join("");
}

function renderChart(percentages){

  const ctx =
  document
    .getElementById(
      "profileChart"
    );

  new Chart(ctx, {

    type:"radar",

    data:{

      labels:[
        "Analítico",
        "Directivo",
        "Relacional",
        "Facilitador"
      ],

      datasets:[{

        label:"Perfil",

        data:[
          percentages.tierra,
          percentages.fuego,
          percentages.agua,
          percentages.aire
        ],

        backgroundColor:
          "rgba(41,98,255,.2)",

        borderColor:
          "#2962ff",

        borderWidth:3

      }]

    },

    options:{
      responsive:true,
      maintainAspectRatio:false,

      scales:{
        r:{
          beginAtZero:true,
          max:50
        }
      }
    }

  });
}

document
.getElementById(
 "downloadPdfBtn"
)
.addEventListener(
 "click",
 () => {

   const pdf =
   new PdfGenerator(
     result
   );

   pdf.download();

 }
);

</script>

</body>
</html>
